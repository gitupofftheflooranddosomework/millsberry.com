name: Temporary character art import

on:
  push:
    branches:
      - work/11-character-development-standard
    paths:
      - .github/tmp-art-pack/pack.b64

permissions:
  contents: write

jobs:
  import-character-art:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: work/11-character-development-standard
          fetch-depth: 0

      - name: Decode and verify approved pack
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/tmp-art-pack/pack.b64 > /tmp/millsberry-character-art.zip
          echo "198b2a9a52cb27f72636c9e062d55079cf8f30f1d1e7787848f556d4bd8e7ee8  /tmp/millsberry-character-art.zip" | sha256sum --check -

      - name: Install artist-facing pack
        shell: bash
        run: |
          set -euo pipefail
          unzip -o /tmp/millsberry-character-art.zip -d .
          test -f character-art/START-HERE.md
          test -f character-art/example-classic-cartoon/STYLE-GUIDE.md
          test -f character-art/example-classic-cartoon/10-examples/EXAMPLE-FINISHED-CHARACTER.png
          test -f character-art/example-classic-cartoon/10-examples/EXAMPLE-FEMALE-CHARACTER.png
          count="$(find character-art/example-classic-cartoon -type f -name '*.png' | wc -l)"
          test "$count" -eq 19
          find character-art/example-classic-cartoon -type f -name '*.png' -print0 | xargs -0 file | grep -v 'PNG image data, 1024 x 1024' && exit 1 || true

      - name: Remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/tmp-art-pack
          rm -f .github/workflows/tmp-character-art-import.yml

      - name: Commit installed pack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Install approved Classic Cartoon example art pack (refs #11)"
          git push origin HEAD:work/11-character-development-standard
